<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&family=Sofia+Sans+Semi+Condensed:wght@500;600;700&family=Sofia+Sans+Extra+Condensed:wght@700;800;900&display=swap" rel="stylesheet"></helmet>
<div style="width:1200px;height:630px;display:grid;grid-template-columns:500px 700px;color:#1C1B19;font-family:'Sofia Sans',sans-serif;font-variant-numeric:tabular-nums;overflow:hidden">
<div style="background:#EBC85A;padding:56px 48px 52px;display:flex;flex-direction:column;justify-content:space-between">
<span data-logo="true" style="display:flex;flex-direction:column;gap:5px"><span style="font:800 41px/1 'Sofia Sans Extra Condensed',sans-serif;text-transform:uppercase;letter-spacing:.01em">A su precio</span><span style="font:500 22px/1.2 'Sofia Sans',sans-serif">¿Tiene sentido este precio?</span></span>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font:900 200px/.78 'Sofia Sans Extra Condensed',sans-serif;letter-spacing:-.015em;margin-left:-8px">{{ pct }}</span><span style="font:600 32px/1.2 'Sofia Sans',sans-serif">sobre la parte alta de la referencia</span></div>
</div>
<div style="background:#F6F4EE;padding:56px 56px 52px;display:flex;flex-direction:column;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:20px">
<span style="display:inline-flex;align-self:flex-start;align-items:center;gap:12px;padding:10px 18px 10px 12px;background:#E9DFF1;color:#6A3A8C;border-radius:8px;font:700 30px/1.2 'Sofia Sans',sans-serif"><svg width="30" height="30" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#6A3A8C"></circle><path d="M6 12l4-4.5 4 4.5" stroke="#E9DFF1" stroke-width="2" fill="none"></path></svg>Por encima del techo</span>
<span style="font:800 48px/1.08 'Sofia Sans',sans-serif;text-wrap:pretty">Un piso en {{ barrio }}, frente a los alquileres registrados de su zona.</span>
</div>
<div style="position:relative;height:56px">
<div style="position:absolute;left:0;right:0;top:12px;height:32px;background:#E4DFD5"></div>
<div style="position:absolute;top:12px;height:32px;left:{{ bandL }}px;width:{{ bandW }}px;background:#1C1B19"></div>
<div style="position:absolute;top:12px;height:32px;left:{{ hiX }}px;width:{{ techoW }}px;background:#857F74"></div>
<div style="position:absolute;top:26px;height:4px;left:{{ tX }}px;width:{{ guideW }}px;background:#6A3A8C"></div>
<div style="position:absolute;top:6px;left:{{ dotX }}px;width:44px;height:44px;margin-left:-22px;border-radius:50%;box-sizing:border-box;border:5px solid #F6F4EE;background:#6A3A8C"></div>
</div>
<span style="font:700 32px 'Sofia Sans',sans-serif">Comprueba tu piso</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:630},&quot;caso&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;berro_c&quot;,&quot;viso&quot;],&quot;default&quot;:&quot;berro_c&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const NB = '\u00A0';
const D = { berro_c: { barrio: 'Fuente del Berro', pct: '+30' + NB + '%', precio: 2200, lo: 1119, hi: 1691, techo: 1820 }, viso: { barrio: 'El Viso', pct: '+99' + NB + '%', precio: 4000, lo: 1297, hi: 2006, techo: 2149 } };
class Component extends DCLogic {
  renderVals() {
    const C = D[this.props.caso] || D.berro_c;
    const W = 588, max = 1.15 * Math.max(C.precio, C.techo), X = v => v / max * W;
    return { barrio: C.barrio, pct: C.pct, bandL: X(C.lo), bandW: X(C.hi) - X(C.lo), hiX: X(C.hi), techoW: X(C.techo) - X(C.hi), tX: X(C.techo), guideW: Math.max(0, X(C.precio) - X(C.techo) - 20), dotX: X(C.precio) };
  }
}
</script>
</body>
</html>
