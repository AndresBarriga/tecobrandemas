name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run datos
      - run: npm run check
      # Sin geocoder.sqlite (no está en git) se saltan 7 tests del callejero local
      - run: npm test
      - run: npm run build

  desplegar:
    # Solo al fusionar en main, y solo si las pruebas pasan
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run datos
      - run: npm run build
        env:
          # Analítica de uso (PostHog UE, sin cookies): solo en la compilación que se despliega a producción
          PUBLIC_POSTHOG_ENABLED: 'true'
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          # «Lo que se pide» (anuncios recientes): ausente o vacía = ACTIVA; solo el valor exacto `false` la apaga (interruptor de emergencia, con redeploy). Variable del entorno `produccion`, no del repositorio
          PUBLIC_OFERTA_ENABLED: ${{ vars.PUBLIC_OFERTA_ENABLED }}
          # Selector Contratos | Anuncios en /mapa: solo tiene efecto con la anterior activa; ausente o vacía = ACTIVO; solo `false` lo apaga
          PUBLIC_OFERTA_MAPA_ENABLED: ${{ vars.PUBLIC_OFERTA_MAPA_ENABLED }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  humo:
    # Tras desplegar, la prueba de humo de solo lectura contra producción, con reintentos por si
    # el despliegue tarda en propagarse. No sustituye a la hora a hora (humo.yml): solo avisa en esta ejecución.
    needs: desplegar
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.URL_PRODUCCION || 'https://asuprecio.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sleep 20
      - run: npx playwright test e2e/humo.spec.ts --project=movil-390 --retries=3 --reporter=list
